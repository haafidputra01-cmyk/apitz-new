<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APITZ OFFICIAL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

body::before{
content:'';
position:absolute;
width:400px;
height:400px;
background:#ff0050;
filter:blur(180px);
top:-100px;
left:-100px;
}

body::after{
content:'';
position:absolute;
width:400px;
height:400px;
background:#00f2ea;
filter:blur(180px);
bottom:-100px;
right:-100px;
}

.card{
position:relative;
z-index:1;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
padding:30px;
border-radius:25px;
width:350px;
text-align:center;
border:1px solid rgba(255,255,255,0.15);
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:4px solid #fff;
cursor:pointer;
transition:.3s;
box-shadow:0 0 30px #00f2ea;
}

.avatar:hover{
transform:scale(1.08);
box-shadow:0 0 50px #ff0050;
}

h1{
margin-top:15px;
color:white;
font-size:28px;
}

.bio{
color:#ddd;
margin-top:5px;
margin-bottom:20px;
}

.btn{
display:block;
padding:15px;
margin-top:12px;
text-decoration:none;
border-radius:15px;
font-weight:600;
transition:.3s;
}

.saweria{
background:#ff7b00;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

.btn:hover{
transform:translateY(-3px);
}

.footer{
margin-top:20px;
color:#aaa;
font-size:13px;
}
</style>
</head>
<body>

<div class="card">

<a href="https://whatsapp.com/channel/0029VbE6SzoAO7R87K3HTf2F" target="_blank">
<img src="avatar.jpg" class="avatar" alt="Avatar Apitz">
</a>

<h1>APITZ OFFICIAL</h1>

<p class="bio">
Creator • Roblox • TikTok
</p>

<a href="https://saweria.co/Apitz" target="_blank" class="btn saweria">
💰 DONATE SAWERIA
</a>

<a href="https://whatsapp.com/channel/0029VbE6SzoAO7R87K3HTf2F" target="_blank" class="btn whatsapp">
📢 JOIN WHATSAPP CHANNEL
</a>

<div class="footer">
Klik avatar untuk masuk ke channel WhatsApp
</div>

</div>

</body>
</html>
